name: Alignment input tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-alignment.txt
      - run: python -m pip install -r requirements.txt -r requirements-alignment.txt
      - run: python -m compileall -q main.py utils tests
      - run: python -m unittest discover -s tests -v
